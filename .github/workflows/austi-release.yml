name: Release Austi

on:
  push:
    branches: [release/austi]
    paths:
      - .github/workflows/austi-release.yml
      - .node-version
      - apps/austi/**
      - packages/ui/**
      - bun.lock
      - package.json
      - rust-toolchain.toml
  workflow_dispatch:
    inputs:
      version_update:
        description: Version update
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - keep

permissions:
  contents: write

concurrency:
  group: austi-release
  cancel-in-progress: false

jobs:
  release:
    name: Build Apple Silicon release
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'release/austi' || github.ref }}

      - name: Promote main to Austi release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main release/austi
          git merge --no-edit origin/main

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc # v1.9.0
        with:
          cache-workspaces: apps/austi/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update release version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION_UPDATE: ${{ inputs.version_update }}
        run: bun apps/austi/scripts/bump-version.ts "$VERSION_UPDATE"

      - name: Validate release version
        id: version
        shell: bash
        run: |
          app_version="$(bun -e 'console.log((await Bun.file("apps/austi/src-tauri/tauri.conf.json").json()).version)')"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' apps/austi/src-tauri/Cargo.toml)"
          if [[ "$app_version" != "$cargo_version" ]]; then
            echo "tauri.conf.json ($app_version) and Cargo.toml ($cargo_version) versions differ"
            exit 1
          fi
          echo "version=$app_version" >> "$GITHUB_OUTPUT"

      - name: Test frontend
        run: bun run --filter austi test

      - name: Check Rust formatting
        run: bun run --filter austi check:format:rust

      - name: Lint Rust
        run: bun run --filter austi lint:rust

      - name: Test Rust
        run: bun run --filter austi test:rust

      - name: Commit release promotion
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add apps/austi/src-tauri/Cargo.lock apps/austi/src-tauri/Cargo.toml apps/austi/src-tauri/tauri.conf.json
          if ! git diff --cached --quiet; then
            git commit -m "Release Austi v${RELEASE_VERSION}"
          fi
          git push origin HEAD:release/austi

      - name: Resolve release commit
        id: release_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build signed updater and publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/austi
          tauriScript: bun tauri
          tagName: austi-v__VERSION__
          releaseCommitish: ${{ steps.release_commit.outputs.sha }}
          releaseName: Austi v__VERSION__
          releaseBody: Download the DMG to install Austi. Existing installations update from this release after it is published.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
